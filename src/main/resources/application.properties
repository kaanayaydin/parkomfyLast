server.port=8080
# Telefon/tablet aynı Wi-Fi'den erişebilsin (sadece localhost değil).
server.address=0.0.0.0
spring.application.name=PARKOMFY

# Database Configuration (MySQL) — override via MYSQL_URL / MYSQL_USER / MYSQL_PASSWORD env vars
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/parkomfy}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# gRPC Configuration
grpc.server.port=50051
grpc.client.yolo-service.address=localhost:50051

# Logging
logging.level.com.parkomfy=INFO
logging.level.org.springframework=WARN
